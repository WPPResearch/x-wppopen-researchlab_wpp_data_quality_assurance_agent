[project]
name = "data-science"
version = "0.1.0"
description = "A Data Science agent for automated SQL generation, data analysis, and telemetry-instrumented workflows."
authors = [
    { name = "Google LLC" }
]
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "python-dotenv>=1.2.2",
    "google-adk[eval]>=1.28.1",
    "immutabledict>=4.2.1",
    "sqlglot>=26.10.1",
    "db-dtypes>=1.4.2",
    "regex>=2024.11.6",
    "tabulate>=0.9.0",
    "google-cloud-aiplatform[agent-engines]>=1.93.0",
    "absl-py>=2.2.2",
    "pydantic>=2.11.3",
    "pandas>=2.3.0",
    "numpy>=2.3.1",
    "toolbox-core>=0.3.0",
    "opentelemetry-sdk>=1.36.0",
    "opentelemetry-exporter-otlp-proto-http>=1.36.0",
    "pg8000>=1.31.2",
    "markdown>=3.10.1",
    "weasyprint>=68.0",
    "matplotlib>=3.10.8",
    "fpdf2>=2.8.5",
    "markdown2>=2.5.4",
    "a2a-sdk>=0.2.7,<1.0.0",
    "python-multipart>=0.0.27",
    "nltk>=3.9.4",
    "authlib>=1.7.2",
    "werkzeug>=3.1.3",
    "starlette>=1.3.1",
    "google-cloud-dataplex>=2.0.0",
]

[dependency-groups]
dev = [
    "google-cloud-aiplatform[agent-engines,evaluation]>=1.93.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "google-adk[eval]>=1.28.1",
    "ruff>=0.4.6",
    "pre-commit>=4.5.1",
    "ipykernel>=7.2.0",
]

[tool.ruff]
# Points back to the Master template in the root


[tool.ruff.lint]
ignore = ["C901", "PLR0911", "PLR0912", "PLW0603"]

[tool.ruff.lint.isort]
# Ensures the data science source is treated as first-party
known-first-party = ["data_science"]

[tool.hatch.build.targets.wheel]
# Maps the package source correctly for Hatchling
packages = ["data_science"]

[tool.pytest.ini_options]
console_output_style = "progress"
addopts = "-vv -s"
testpaths = ["tests/"]
log_level = "DEBUG"
log_cli = true
log_auto_indent = true
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_format = "[%(asctime)s] %(levelname)s (%(funcName)s) \t [%(pathname)s:%(lineno)d] %(message)s"
filterwarnings = [
    "ignore::UserWarning",
]

[tool.uv.sources]
nltk = { git = "https://github.com/nltk/nltk.git", branch = "develop" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
